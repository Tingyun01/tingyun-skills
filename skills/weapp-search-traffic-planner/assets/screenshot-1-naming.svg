<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="644" fill="#FFFFFF"/><rect width="1200" height="128" fill="#1F3A34"/><text x="64" y="56" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">小程序搜一搜落地卡 · 一、命名合规预检表</text><text x="64" y="96" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#B9CFC7">逐项三态判定；必改与需人工确认清零之前不要提交审核</text><rect x="64" y="164" width="8" height="424" rx="4" fill="#2E8B72"/><rect x="96" y="162" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="200" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">仅由通用词/品类词构成</text><text x="470" y="200" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">官方要求改为品牌+功能描述</text><rect x="960" y="172" width="150" height="38" rx="19" fill="#C0392B"/><text x="985" y="200" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">必改</text><rect x="96" y="236" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="274" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">含商业化用语（免费/清仓）</text><text x="470" y="274" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">删除或改为品牌与产品描述</text><rect x="960" y="246" width="150" height="38" rx="19" fill="#C0392B"/><text x="985" y="274" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">必改</text><rect x="96" y="310" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="348" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">含广告法极限用语（最/第一）</text><text x="470" y="348" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">全部删除</text><rect x="960" y="320" width="150" height="38" rx="19" fill="#C0392B"/><text x="985" y="348" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">必改</text><rect x="96" y="384" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="422" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">疑似含第三方品牌标识</text><text x="470" y="422" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">未经授权属侵权，需人工确认</text><rect x="960" y="394" width="150" height="38" rx="19" fill="#C9A227"/><text x="985" y="422" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">需人工确认</text><rect x="96" y="458" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="496" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">名称全局唯一性查重结果</text><text x="470" y="496" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">微信搜一搜输入候选名</text><rect x="960" y="468" width="150" height="38" rx="19" fill="#C9A227"/><text x="985" y="496" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">需人工确认</text><rect x="96" y="532" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="570" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">服务类目是否不可逆</text><text x="470" y="570" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">游戏类目提交后不可改</text><rect x="960" y="542" width="150" height="38" rx="19" fill="#C9A227"/><text x="985" y="570" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">需人工确认</text></svg>