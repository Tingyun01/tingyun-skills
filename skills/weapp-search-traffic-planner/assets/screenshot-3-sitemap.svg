<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><rect width="1200" height="644" fill="#FFFFFF"/><rect width="1200" height="128" fill="#1F3A34"/><text x="64" y="56" font-family="Microsoft YaHei,sans-serif" font-size="34" font-weight="bold" fill="#FFFFFF">小程序搜一搜落地卡 · 三、收录配置清单</text><text x="64" y="96" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#B9CFC7">sitemap 规则 · 路径推送 · 爬虫一致性三条核查</text><rect x="64" y="164" width="8" height="424" rx="4" fill="#1F3A34"/><rect x="96" y="162" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="200" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">sitemap.json 已填</text><text x="470" y="200" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">默认 allow:* + disallow 低价值页</text><rect x="960" y="172" width="150" height="38" rx="19" fill="#2E8B72"/><text x="985" y="200" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">通过</text><rect x="96" y="236" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="274" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">需推送页面已列出</text><text x="470" y="274" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">search.submitPages 主动推送</text><rect x="960" y="246" width="150" height="38" rx="19" fill="#2E8B72"/><text x="985" y="274" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">通过</text><rect x="96" y="310" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="348" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">web-view 页面</text><text x="470" y="348" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">内容不会被收录，不布局关键词</text><rect x="960" y="320" width="150" height="38" rx="19" fill="#C0392B"/><text x="985" y="348" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">必改</text><rect x="96" y="384" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="422" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">爬虫所见与用户所见</text><text x="470" y="422" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">不一致则该页不进索引</text><rect x="960" y="394" width="150" height="38" rx="19" fill="#C9A227"/><text x="985" y="422" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">需人工确认</text><rect x="96" y="458" width="1040" height="62" rx="10" fill="#F5FAF8"/><text x="124" y="496" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">页面标题独立</text><text x="470" y="496" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">每页独立标题，不用统一「首页」</text><rect x="960" y="468" width="150" height="38" rx="19" fill="#C0392B"/><text x="985" y="496" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">必改</text><rect x="96" y="532" width="1040" height="62" rx="10" fill="#FFFFFF"/><text x="124" y="570" font-family="Microsoft YaHei,sans-serif" font-size="21" fill="#1F3A34">观察排期 ≥3 天</text><text x="470" y="570" font-family="Microsoft YaHei,sans-serif" font-size="20" fill="#5B6B66">索引非即时，当天不下结论</text><rect x="960" y="542" width="150" height="38" rx="19" fill="#C9A227"/><text x="985" y="570" font-family="Microsoft YaHei,sans-serif" font-size="19" fill="#FFFFFF">需人工确认</text></svg>